<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>숫자 증가 버튼</title>
</head>
<body>

  <h1 id="number">0</h1>
  <button onclick="increaseNumber()">+1</button>

  <script>
    let number = 0;

    function increaseNumber() {
      number++;
      document.getElementById("number").textContent = number;
    }
  </script>

</body>
</html>
