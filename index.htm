<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>입력 내용 적용하기</title>
</head>
<body>

  <input type="text" id="inputText" placeholder="내용을 입력하세요">
  <button onclick="applyText()">적용</button>

  <h2 id="result">여기에 입력한 내용이 표시됩니다.</h2>

  <script>
    function applyText() {
      const text = document.getElementById("inputText").value;
      document.getElementById("result").textContent = text;
    }
  </script>

</body>
</html>
</html>
