<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title> 군대에서 만든 게임 </title>
</head>
<body>

	<script>

	let player_x=0;
	const FPS=60;

	function game()
	{
  		step();
		draw();
	}
	function step()
	{
		player_x+=1;
	}
	function draw()
	{
		console.log(player_x);
	}
	setInterval(game,1000/FPS);

	</script>

</body>
</html>
